# Writes to saved projects are rate-limited per client; reads are not (an empty key is not counted).
map $request_method $esp32sim_project_write { default $binary_remote_addr; GET ""; HEAD ""; }
limit_req_zone $esp32sim_project_write zone=esp32sim_projects:1m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/wasm wasm;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;

    # Saved firmware projects (web/emu.js): projects/<name>/manifest.json plus <kind>.bin, on a volume.
    # ^~ keeps the .json regex below from taking manifest PUTs. GET of projects/ lists them as JSON,
    # which is how the page detects the feature; without the volume it is a 404 and the page hides it.
    # Never add Access-Control-* headers or OPTIONS handling here: the failing CORS preflight is what
    # stops other sites from writing through a visitor's browser.
    location ^~ /wasm/fw/projects/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        # PUT and DELETE only on fixed names; DELETE <name>/ removes a whole project. Elsewhere 405.
        location ~ "^/wasm/fw/projects/[a-z0-9-]{1,40}/((rom|flash|bootloader|ptable|app|elf|script)\.bin|manifest\.json)?$" {
            dav_methods PUT DELETE;
            create_full_put_path on;
            dav_access user:rw group:r all:r;
            client_max_body_size 33m;
            limit_req zone=esp32sim_projects burst=30 nodelay;
        }
    }

    location ~* \.(html|js|mjs|json|wasm|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
